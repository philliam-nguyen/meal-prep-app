# The local stack: Postgres, the migration step, and the API serving the frontend from its own
# origin. The Homelab Variant is this file plus Tailscale and a backup job; no host paths are
# assumed, so it lifts into a virtual machine unchanged.
#
# Every value comes from .env. Nothing here carries a default password, and no connection string is
# written down anywhere but here, assembled from parts.

name: meal-prep

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meal_prep}
      POSTGRES_USER: ${POSTGRES_OWNER_ROLE:-meal_prep_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Runs to completion as the owner role, then the API starts. The only container that holds owner
  # credentials or has any DDL rights. Runs the api service's image with a different command, so the
  # image is built once and there is no second artifact to keep in step.
  migrate:
    image: meal-prep-app:local
    pull_policy: never
    command: ['node', 'packages/api/src/migrate.js']
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_OWNER_ROLE:-meal_prep_owner}:${POSTGRES_OWNER_PASSWORD}@db:5432/${POSTGRES_DB:-meal_prep}
      APP_DB_ROLE: ${APP_DB_ROLE:-meal_prep_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  # The only service that builds. Compose builds before it creates any container, so the migrate
  # service finds this image even though it starts first.
  api:
    build: .
    image: meal-prep-app:local
    environment:
      DATABASE_URL: postgres://${APP_DB_ROLE:-meal_prep_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-meal_prep}
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Guardrail limits, passed through rather than defaulted here: the defaults live in
      # packages/api/src/config.js so this file and the Demo Variant's Terraform cannot drift apart
      # from each other or from the code. Only the allowed origin has no default to fall back to.
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env to however you reach the app}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES}
      WRITE_RATE_LIMIT: ${WRITE_RATE_LIMIT}
      WRITE_RATE_WINDOW_MS: ${WRITE_RATE_WINDOW_MS}
      RECIPES_MAX: ${RECIPES_MAX}
      TRUST_PROXY: ${TRUST_PROXY}
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  database:
