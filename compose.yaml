# Postgres, the migration step, and the API serving the frontend from its own origin. The Homelab
# Variant is this file plus Tailscale and a backup job; no host paths are assumed, so it lifts into
# a virtual machine unchanged.
#
# Nothing here builds. Both Variants run the one published image (ADR-0002), and a file that could
# build would quietly do so on the homelab whenever the tag was missing, running local source under
# a name that says otherwise. Building it is compose.build.yaml's job.
#
# Every value comes from .env. Nothing here carries a default password, and no connection string is
# written down anywhere but here, assembled from parts.

name: meal-prep

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meal_prep}
      POSTGRES_USER: ${POSTGRES_OWNER_ROLE:-meal_prep_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Runs to completion as the owner role, then the API starts. The only container that holds owner
  # credentials or has any DDL rights. The api service's image with a different command, so a
  # deployment is one image and there is no second artifact to keep in step.
  migrate:
    image: ${MEAL_PREP_IMAGE:?set MEAL_PREP_IMAGE in .env to the image tag you mean to run}
    command: ['node', 'packages/api/src/migrate.js']
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_OWNER_ROLE:-meal_prep_owner}:${POSTGRES_OWNER_PASSWORD}@db:5432/${POSTGRES_DB:-meal_prep}
      APP_DB_ROLE: ${APP_DB_ROLE:-meal_prep_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    image: ${MEAL_PREP_IMAGE:?set MEAL_PREP_IMAGE in .env to the image tag you mean to run}
    environment:
      DATABASE_URL: postgres://${APP_DB_ROLE:-meal_prep_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-meal_prep}
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Guardrail limits, passed through rather than defaulted here: the defaults live in
      # packages/api/src/config.js so this file and the Demo Variant's Terraform cannot drift apart
      # from each other or from the code. Only the allowed origin has no default to fall back to.
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env to however you reach the app}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES}
      WRITE_RATE_LIMIT: ${WRITE_RATE_LIMIT}
      WRITE_RATE_WINDOW_MS: ${WRITE_RATE_WINDOW_MS}
      RECIPES_MAX: ${RECIPES_MAX}
      TRUST_PROXY: ${TRUST_PROXY}
      # A line every visitor reads, or nothing. Passed through like the limits above, and left blank
      # here: the instance this file deploys is the one holding real data, and it has nothing to
      # announce to the person who owns it.
      SITE_NOTICE: ${SITE_NOTICE}
    # Loopback, never the host's other addresses. On the homelab `tailscale serve` is what reaches
    # this port, and it runs on the host; publishing any wider would put an app with no login of its
    # own (ADR-0003) in front of the whole local network, where nothing about the deployment says so.
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  database:
