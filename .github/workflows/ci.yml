name: ci

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      # The report and the failure traces, so a red run on the mobile project can be inspected
      # without a phone.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  publish-image:
    needs: [test, browser-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run record
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:main" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
  publish-bundle:
    needs: [test, browser-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEMO_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws s3 sync packages/web/dist "s3://${{ vars.DEMO_BUCKET }}" --delete
      - run: aws cloudfront create-invalidation --distribution-id ${{ vars.DEMO_DISTRIBUTION_ID }} --paths "/*"
